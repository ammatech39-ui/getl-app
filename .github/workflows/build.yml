name: Build HTML to EXE
on: [push, workflow_dispatch]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Nativefier
        run: npm install -g nativefier

      - name: Rename HTML File for Build
        run: |
          Rename-Item -Path "kraa-pro-v3-final(8).html" -NewName "index.html"

      - name: Build Desktop App
        run: |
          nativefier --name "KraaPro" --platform "windows" --arch "x64" --single-instance "index.html" --internal-urls ".*"

      - name: Compress App Folder
        run: |
          Compress-Archive -Path "KraaPro-win32-x64" -DestinationPath "KraaPro-Windows.zip"

      - name: Upload KraaPro Program
        uses: actions/upload-artifact@v4
        with:
          name: KraaPro-Windows-App
          path: KraaPro-Windows.zip
